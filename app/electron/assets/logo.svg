<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2537"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="51" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <!-- 三根用量条：绿/黄/红对应看板进度条的分级配色 -->
  <rect x="55" y="140" width="34" height="52" rx="9" fill="#34d399"/>
  <rect x="111" y="100" width="34" height="92" rx="9" fill="#fbbf24"/>
  <rect x="167" y="60" width="34" height="132" rx="9" fill="#fb7185"/>
  <!-- 看板进度条上的白色时间位置标记线 -->
