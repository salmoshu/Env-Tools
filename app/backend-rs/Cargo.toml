[package]
name = "env-tools-api"
version = "0.8.6"
edition = "2021"
description = "Env-Tools desktop local API gateway (axum): analytics/usage relay with single-flight caching"

[dependencies]
axum = "0.8"
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
serde_json = "1"
# 增量扫描缓存落盘的结构体序列化（scan-cache-<scope>.json）
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# apply-update 子命令解压升级包用（替代运行时 powershell Expand-Archive / tar 调用）；
# default-features 精简：zip 仅 deflate，flate2 用纯 Rust 后端，tar 无扩展属性
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# GLM Coding Plan 重置卡：解密 ZCode 本机凭证（enc:v1 = AES-256-GCM，密钥为
# sha256 派生串），无替代品只能自实现解密；RustCrypto 纯 Rust 小 crate
aes-gcm = "0.10"
sha2 = "0.10"
# 回收站枚举/永久删除/还原（trash::os_limited，与 Jharu bin.rs 同源方案）。
# 跨平台：Linux 走 freedesktop 后端，Windows 走 shell，保持 Linux 构建可用。
trash = "5"
# Jharu 同源磁盘引擎：并行遍历、物理空间统计、内容哈希与平台卷信息。
jwalk = "0.8"
sysinfo = "0.33"
dirs = "5"
plist = "1"
blake3 = "1"

[target.'cfg(windows)'.dependencies]
# 启动项 Run 键 / StartupApproved 开关 / 卸载表读取（Jharu startup.rs、apps.rs 同源方案）
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
