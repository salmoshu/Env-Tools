[package]
name = "env-tools-api"
version = "0.7.7"
edition = "2021"
description = "Env-Tools desktop local API gateway (axum): analytics/usage relay with single-flight caching"

[dependencies]
axum = "0.8"
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
# apply-update 子命令解压升级包用（替代运行时 powershell Expand-Archive / tar 调用）；
# default-features 精简：zip 仅 deflate，flate2 用纯 Rust 后端，tar 无扩展属性
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
