<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2420"/>
      <stop offset="1" stop-color="#16120f"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- 墨色底：与深色主题同族的暖黑 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#fafaf9" stroke-opacity="0.07" stroke-width="2"/>
  <!-- 三根用量柱：品牌橙三阶（brand-300/400/500），随高度升温；柱/线统一 20px 栅格间距 -->
  <rect x="41" y="136" width="36" height="58" rx="18" fill="#fdba74"/>
  <rect x="97" y="94" width="36" height="100" rx="18" fill="#fb923c"/>
  <rect x="179" y="48" width="36" height="146" rx="18" fill="url(#bar3)"/>
  <!-- 纸白“当前时刻”光标线：与最高柱等高，呼应看板的 now 标记 -->
  <rect x="153" y="48" width="6" height="146" rx="3" fill="#fafaf9" fill-opacity="0.9"/>
</svg>
