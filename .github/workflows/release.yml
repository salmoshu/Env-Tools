name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend-rs
      - name: Build linux agent binary
        working-directory: app/backend-rs
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: app/backend-rs/target/release/env-tools-api

  build:
    needs: [agent-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, backend: env-tools-api }
          - { os: windows-2022, platform: win32, backend: env-tools-api.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend-rs
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Rust agent (native backend)
        working-directory: app/backend-rs
        run: cargo build --release

      - name: Download linux agent (for WSL bootstrap from Windows)
        if: matrix.platform == 'win32'
        uses: actions/download-artifact@v4
        with:
          name: agent-linux
          path: agent-linux

      - name: Install NSIS (windows setup installer)
        if: matrix.platform == 'win32'
        run: choco install nsis -y --no-progress

      - name: Build renderer
        working-directory: app
        run: |
          pnpm install
          pnpm exec vite build

      - name: Package (linux)
        if: matrix.platform == 'linux'
        working-directory: app
        shell: bash
        run: node scripts/package.mjs --platform linux --out release

      - name: Package (windows, zip + NSIS setup)
        if: matrix.platform == 'win32'
        working-directory: app
        shell: pwsh
        run: |
          node scripts/package.mjs --platform win32 --out release --linux-agent (Resolve-Path ../agent-linux/env-tools-api).Path
          if (-not (Test-Path "release/*.exe")) { throw "setup exe missing after packaging" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: |
            app/release/*.tar.gz
            app/release/*.zip
            app/release/*.exe

  release:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate latest.json (auto-update feed)
        working-directory: artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WIN_FILE=$(ls pkg-win32/*setup*.exe | xargs -n1 basename)
          LIN_FILE=$(ls pkg-linux/*.tar.gz | xargs -n1 basename)
          WIN_SHA=$(sha256sum "pkg-win32/$WIN_FILE" | cut -d' ' -f1)
          LIN_SHA=$(sha256sum "pkg-linux/$LIN_FILE" | cut -d' ' -f1)
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "files": {
              "win32": { "name": "$WIN_FILE", "sha256": "$WIN_SHA", "installer": true },
              "linux": { "name": "$LIN_FILE", "sha256": "$LIN_SHA" }
            }
          }
          EOF
          cat latest.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
