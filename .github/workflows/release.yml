name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend-rs
      - name: Build linux agent binary
        working-directory: app/backend-rs
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: app/backend-rs/target/release/env-tools-api

  build:
    needs: [agent-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, backend: env-tools-api }
          - { os: windows-2022, platform: win32, backend: env-tools-api.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Rust agent (native backend)
        working-directory: app/backend-rs
        run: cargo build --release

      - name: Download linux agent (for WSL bootstrap from Windows)
        if: matrix.platform == 'win32'
        uses: actions/download-artifact@v4
        with:
          name: agent-linux
          path: agent-linux

      - name: Download embedded Python (windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-pc-windows-msvc-shared-install_only.tar.gz"
          curl.exe -sL $url -o python.tar.gz
          if (-not (Test-Path "python.tar.gz")) { throw "python download failed" }
          Write-Host "archive size: $((Get-Item python.tar.gz).Length)"
          New-Item -ItemType Directory -Force -Path python | Out-Null
          # runner 自带 bsdtar 解该包会得到空目录，用 Python 标准库解压
          python -m tarfile -e python.tar.gz python
          if (-not (Test-Path "python/python.exe")) {
            Get-ChildItem -Recurse python | Select-Object -First 10 | ForEach-Object { Write-Host $_.FullName }
            throw "python.exe missing after extract"
          }
          Write-Host "python.exe ok"

      - name: Build renderer
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Package (linux)
        if: matrix.platform == 'linux'
        working-directory: app
        shell: bash
        run: node scripts/package.mjs --platform linux --out release

      - name: Package (windows)
        if: matrix.platform == 'win32'
        working-directory: app
        shell: pwsh
        run: node scripts/package.mjs --platform win32 --out release --linux-agent (Resolve-Path ../agent-linux/env-tools-api).Path --python-dir (Resolve-Path ../python).Path

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: |
            app/release/*.tar.gz
            app/release/*.zip

  release:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate latest.json (auto-update feed)
        working-directory: artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WIN_FILE=$(ls pkg-win32/*.zip | xargs -n1 basename)
          LIN_FILE=$(ls pkg-linux/*.tar.gz | xargs -n1 basename)
          WIN_SHA=$(sha256sum "pkg-win32/$WIN_FILE" | cut -d' ' -f1)
          LIN_SHA=$(sha256sum "pkg-linux/$LIN_FILE" | cut -d' ' -f1)
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "files": {
              "win32": { "name": "$WIN_FILE", "sha256": "$WIN_SHA" },
              "linux": { "name": "$LIN_FILE", "sha256": "$LIN_SHA" }
            }
          }
          EOF
          cat latest.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/latest.json
          generate_release_notes: true
